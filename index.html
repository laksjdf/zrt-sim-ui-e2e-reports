<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZRT Sim UI · Playwright Reports</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #0d1117;
        color: #e6edf3;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }
      main {
        width: min(640px, calc(100% - 48px));
        padding: 40px;
        border: 1px solid #30363d;
        border-radius: 16px;
        background: #161b22;
        box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(28px, 6vw, 44px);
        letter-spacing: -0.04em;
      }
      p {
        margin: 0;
        color: #8b949e;
        font-size: 17px;
        line-height: 1.7;
      }
      code {
        color: #79c0ff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Playwright Reports</h1>
      <p>
        每次 GitHub Actions 运行都会生成独立报告。
        请从对应运行的 Summary 点击“打开 Playwright 报告”进入。
      </p>
    </main>
  </body>
</html>
