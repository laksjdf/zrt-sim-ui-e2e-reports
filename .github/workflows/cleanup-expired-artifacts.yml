name: Cleanup Expired Pages Artifacts

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete expired artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          page=1
          deleted=0
          while :; do
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GH_REPOSITORY/actions/artifacts?per_page=100&page=$page")"
            count="$(jq '.artifacts | length' <<<"$response")"
            while IFS= read -r artifact_id; do
              test -n "$artifact_id" || continue
              curl --fail --silent --show-error --request DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$GH_REPOSITORY/actions/artifacts/$artifact_id"
              deleted=$((deleted + 1))
            done < <(jq -r '.artifacts[] | select(.expired) | .id' <<<"$response")
            test "$count" -lt 100 && break
            page=$((page + 1))
          done
          echo "Deleted $deleted expired GitHub Pages artifact(s)." >> "$GITHUB_STEP_SUMMARY"
